<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>orbita — Painel Master</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: rgba(15,20,36,0.8);
      --border: rgba(78,159,255,0.1); --text: #dde4f0;
      --sub: rgba(221,228,240,0.4); --muted: rgba(221,228,240,0.2);
      --accent: #4e9fff; --accent2: #7c5cfc;
      --green: #34d399; --red: #f87171; --purple: #a78bfa;
      --radius: 10px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
    body::before { content: ''; position: fixed; top: -200px; right: -100px; width: 500px; height: 500px; background: #1a3a7a; border-radius: 50%; filter: blur(120px); opacity: 0.15; pointer-events: none; z-index: 0; }
    body::after { content: ''; position: fixed; bottom: -100px; left: -50px; width: 300px; height: 300px; background: #7c5cfc; border-radius: 50%; filter: blur(100px); opacity: 0.1; pointer-events: none; z-index: 0; }

    /* LOGIN */
    #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .login-box { width: 100%; max-width: 360px; position: relative; z-index: 1; }
    .login-logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 2rem; }
    .orb { position: relative; width: 36px; height: 36px; }
    .orb-ring { position: absolute; top: 50%; left: 50%; width: 33px; height: 15px; border: 1.5px solid #4e9fff; border-radius: 50%; transform: translate(-50%,-50%) rotate(-25deg); }
    .orb-sphere { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; background: radial-gradient(circle at 35% 35%,#6ab4ff,#1a3a7a); border-radius: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 12px rgba(78,159,255,0.4); }
    .orb-dot { position: absolute; top: 3px; right: 2px; width: 5px; height: 5px; background: #7c5cfc; border-radius: 50%; }
    .logo-name { color: #dde4f0; font-weight: 300; letter-spacing: 3px; font-size: 22px; }
    .login-card { background: rgba(15,20,36,0.9); border: 1px solid rgba(78,159,255,0.15); border-radius: 16px; padding: 2rem; backdrop-filter: blur(20px); }
    .login-card p { color: var(--sub); font-size: 13px; text-align: center; margin-bottom: 1.5rem; }
    .field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 5px; }
    .field input { width: 100%; padding: 11px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(78,159,255,0.15); border-radius: var(--radius); font-family: inherit; font-size: 14px; color: var(--text); outline: none; margin-bottom: 1rem; }
    .field input:focus { border-color: rgba(78,159,255,0.4); }
    .field input::placeholder { color: var(--muted); }
    .btn-primary { width: 100%; padding: 13px; background: linear-gradient(135deg,#4e9fff,#7c5cfc); border: none; border-radius: var(--radius); color: #fff; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .error-msg { color: var(--red); font-size: 13px; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 12px; }
    .hidden { display: none !important; }

    /* SIDEBAR */
    #app { display: none; width: 100%; position: relative; z-index: 1; }
    .sidebar { width: 220px; min-width: 220px; height: 100vh; position: sticky; top: 0; background: rgba(8,12,24,0.98); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; backdrop-filter: blur(24px); }
    .sb-logo { display: flex; align-items: center; gap: 10px; padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
    .sb-badge { background: rgba(124,92,252,0.2); color: var(--purple); font-size: 10px; padding: 2px 8px; border-radius: 99px; margin: 8px 18px 16px; display: inline-block; }
    .sb-section { font-size: 10px; color: rgba(78,159,255,0.4); letter-spacing: 0.1em; text-transform: uppercase; padding: 10px 18px 4px; }
    .sb-item { display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: rgba(221,228,240,0.4); font-size: 13px; cursor: pointer; border: none; border-left: 2px solid transparent; background: none; width: 100%; text-align: left; transition: all 0.15s; }
    .sb-item:hover { background: rgba(78,159,255,0.06); color: var(--text); }
    .sb-item.active { background: rgba(78,159,255,0.1); color: var(--accent); border-left-color: var(--accent); }
    .sb-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .sb-count { background: rgba(244,63,94,0.2); color: var(--red); font-size: 10px; padding: 1px 6px; border-radius: 99px; margin-left: auto; }
    .sb-bottom { margin-top: auto; padding: 12px; border-top: 1px solid var(--border); }
    .sb-user { display: flex; align-items: center; gap: 9px; padding: 8px; }
    .sb-av { width: 30px; height: 30px; background: linear-gradient(135deg,#4e9fff,#7c5cfc); border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 600; }
    .sb-logout { display: flex; align-items: center; gap: 10px; padding: 9px 18px; color: rgba(248,113,113,0.5); font-size: 13px; cursor: pointer; border: none; border-left: 2px solid transparent; background: none; width: 100%; text-align: left; margin-top: 4px; }
    .sb-logout:hover { color: var(--red); background: rgba(248,113,113,0.06); }

    /* MAIN */
    .main { flex: 1; padding: 28px; min-height: 100vh; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
    .page-title { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .page-sub { color: var(--sub); font-size: 13px; margin-top: 4px; }

    /* CARDS */
    .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .stat-label { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
    .stat-value { font-size: 24px; font-weight: 600; }
    .stat-value.blue { color: var(--accent); }
    .stat-value.green { color: var(--green); }
    .stat-value.red { color: var(--red); }
    .stat-value.purple { color: var(--purple); }

    /* TABLE */
    .table-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
    .table-head { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .table-title { font-size: 14px; font-weight: 500; }
    .search-input { padding: 7px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; width: 180px; }
    .search-input::placeholder { color: var(--muted); }
    .table-row { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .table-row:last-child { border: none; }
    .row-av { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 12px; font-weight: 600; flex-shrink: 0; background: rgba(78,159,255,0.1); }
    .row-name { color: var(--text); font-size: 14px; font-weight: 500; }
    .row-info { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .pill { padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 500; }
    .pill-active { background: rgba(52,211,153,0.1); color: var(--green); }
    .pill-inactive { background: rgba(244,63,94,0.1); color: var(--red); }
    .pill-basico { background: rgba(78,159,255,0.1); color: var(--accent); }
    .pill-pro { background: rgba(124,92,252,0.1); color: var(--purple); }
    .pill-enterprise { background: rgba(251,146,60,0.1); color: #fb923c; }
    .row-actions { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
    .action-btn { padding: 5px 12px; border-radius: 7px; font-size: 12px; cursor: pointer; font-family: inherit; border: 1px solid var(--border); color: var(--accent); background: rgba(78,159,255,0.08); }
    .action-btn.purple { border-color: rgba(124,92,252,0.2); color: var(--purple); background: rgba(124,92,252,0.08); }
    .action-btn.red { border-color: rgba(244,63,94,0.2); color: var(--red); background: rgba(244,63,94,0.08); }

    /* FORM */
    .form-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
    .form-title { font-size: 11px; color: rgba(78,159,255,0.5); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .form-field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 5px; }
    .form-field input, .form-field select { width: 100%; padding: 9px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--radius); font-family: inherit; font-size: 13px; color: var(--text); outline: none; }
    .form-field input:focus, .form-field select:focus { border-color: rgba(78,159,255,0.3); }
    .form-field input::placeholder { color: var(--muted); }
    .form-field select option { background: #0f1424; }
    .form-msg { font-size: 13px; padding: 8px 12px; border-radius: var(--radius); margin-bottom: 10px; }
    .form-btn { padding: 10px 20px; background: linear-gradient(135deg,#4e9fff,#7c5cfc); border: none; border-radius: var(--radius); color: #fff; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal { background: rgba(10,14,26,0.98); border: 1px solid rgba(78,159,255,0.15); border-radius: 16px; padding: 2rem; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .modal-sub { color: var(--sub); font-size: 12px; margin-bottom: 1.5rem; }
    .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
    .modal-section { font-size: 11px; color: rgba(78,159,255,0.5); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
    .modal-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(78,159,255,0.06); }
    .modal-row:last-child { border: none; }
    .modal-av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .modal-av.admin { background: rgba(78,159,255,0.15); color: var(--accent); }
    .modal-av.colab { background: rgba(124,92,252,0.15); color: var(--purple); }
    .loading { color: var(--muted); font-size: 13px; padding: 1rem 0; }
    .empty { color: var(--muted); font-size: 13px; padding: 1rem 0; text-align: center; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 5px; }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2,1fr); }
      .form-grid { grid-template-columns: 1fr 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="orb"><div class="orb-ring"></div><div class="orb-sphere"></div><div class="orb-dot"></div></div>
      <span class="logo-name">orbita</span>
    </div>
    <div class="login-card">
      <p>Acesso restrito ao administrador master</p>
      <div id="login-error" class="error-msg hidden"></div>
      <div class="field"><label>E-mail</label><input id="login-email" type="email" placeholder="joao@hporg.cnt.br" /></div>
      <div class="field"><label>Senha</label><input id="login-password" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()" /></div>
      <button class="btn-primary" onclick="login()" id="login-btn">Entrar</button>
    </div>
  </div>
</div>

<!-- MODAL ADMINS -->
<div class="modal-overlay hidden" id="modal-admins">
  <div class="modal">
    <button class="modal-close" onclick="fecharModal()">×</button>
    <div class="modal-title" id="modal-title">Gerenciar equipe</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-section">Adicionar admin</div>
    <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
      <input id="ma-nome" placeholder="Nome" style="flex:1;min-width:120px;padding:9px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(78,159,255,0.15);border-radius:9px;color:#dde4f0;font-family:inherit;font-size:13px;outline:none;" />
      <input id="ma-email" placeholder="email@escritorio.com" type="email" style="flex:1;min-width:160px;padding:9px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(78,159,255,0.15);border-radius:9px;color:#dde4f0;font-family:inherit;font-size:13px;outline:none;" />
    </div>
    <div id="ma-msg" class="hidden form-msg"></div>
    <button onclick="adicionarAdmin()" style="width:100%;padding:10px;background:linear-gradient(135deg,#4e9fff,#7c5cfc);border:none;border-radius:9px;color:#fff;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:1.5rem;">+ Adicionar admin</button>
    <div class="modal-section">Equipe atual</div>
    <div id="modal-lista"><div class="loading">Carregando...</div></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar">
    <div class="sb-logo">
      <div class="orb" style="width:28px;height:28px;">
        <div class="orb-ring" style="width:25px;height:11px;border-width:1.5px;"></div>
        <div class="orb-sphere" style="width:10px;height:10px;"></div>
        <div class="orb-dot" style="width:4px;height:4px;top:2px;right:1px;"></div>
      </div>
      <span class="logo-name" style="font-size:15px;letter-spacing:2px;">orbita</span>
    </div>
    <span class="sb-badge">Master</span>

    <span class="sb-section">Visão geral</span>
    <button class="sb-item active" onclick="showPage('dashboard')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </button>
    <button class="sb-item" onclick="showPage('escritorios')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Escritórios
    </button>

    <span class="sb-section">Sistema</span>
    <button class="sb-item" onclick="showPage('alertas')">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Alertas
      <span class="sb-count" id="sb-alert-count" style="display:none;">0</span>
    </button>

    <div class="sb-bottom">
      <div class="sb-user">
        <div class="sb-av">JO</div>
        <div>
          <div style="color:rgba(255,255,255,0.6);font-size:12px;font-weight:500;">João</div>
          <div style="color:rgba(255,255,255,0.25);font-size:11px;">orbita master</div>
        </div>
      </div>
      <button class="sb-logout" onclick="logout()">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </button>
    </div>
  </div>

  <div class="main" id="main-content">
    <div class="loading">Carregando...</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://nacdezqdsouhxgftqaku.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hY2RlenFkc291aHhnZnRxYWt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODU4MjYsImV4cCI6MjA5NDg2MTgyNn0.C1eqGfu7h-oOC0ibw6hzecPsG49e6IrOXrxu0C-mOSY';
const MASTER_EMAIL = 'joao@hporg.cnt.br';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentPage = 'dashboard';
let modalEscritorioId = null;
let modalEscritorioSlug = null;

// AUTH
sb.auth.getSession().then(({ data }) => {
  if (data.session?.user?.email === MASTER_EMAIL) {
    mostrarApp();
  }
});

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session?.user?.email === MASTER_EMAIL) {
    mostrarApp();
  }
  if (event === 'SIGNED_OUT') {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Entrando...';

  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if (error) {
    errEl.textContent = 'E-mail ou senha incorretos.'; errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Entrar'; return;
  }
  if (email !== MASTER_EMAIL) {
    await sb.auth.signOut();
    errEl.textContent = 'Acesso restrito ao administrador master.'; errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

function mostrarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  showPage('dashboard');
}

async function logout() {
  await sb.auth.signOut();
}

// PAGES
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.sb-item').forEach(b => b.classList.remove('active'));
  const btns = document.querySelectorAll('.sb-item');
  btns.forEach(b => { if (b.getAttribute('onclick')?.includes(page)) b.classList.add('active'); });

  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading">Carregando...</div>';

  if (page === 'dashboard') renderDashboard(main);
  if (page === 'escritorios') renderEscritorios(main);
  if (page === 'alertas') renderAlertas(main);
}

// DASHBOARD
async function renderDashboard(main) {
  const { data: escritorios } = await sb.from('escritorios').select('*').order('criado_em', { ascending: false });
  const lista = escritorios || [];
  const ativos = lista.filter(e => e.ativo).length;
  const inativos = lista.length - ativos;

  const { data: admins } = await sb.from('escritorio_admins').select('id');
  const { data: clientes } = await sb.from('clientes').select('id');

  main.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">Dashboard</div><div class="page-sub">Visão geral do Orbita</div></div>
      <button class="form-btn" onclick="showPage('escritorios')">+ Novo escritório</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Escritórios</div><div class="stat-value blue">${lista.length}</div></div>
      <div class="stat-card"><div class="stat-label">Ativos</div><div class="stat-value green">${ativos}</div></div>
      <div class="stat-card"><div class="stat-label">Inativos</div><div class="stat-value red">${inativos}</div></div>
      <div class="stat-card"><div class="stat-label">Clientes</div><div class="stat-value purple">${(clientes||[]).length}</div></div>
    </div>
    <div class="table-card">
      <div class="table-head"><span class="table-title">Escritórios recentes</span></div>
      ${lista.slice(0,5).map(e => rowEscritorio(e)).join('') || '<div class="empty">Nenhum escritório ainda.</div>'}
    </div>`;
}

// ESCRITÓRIOS
async function renderEscritorios(main) {
  const { data: lista } = await sb.from('escritorios').select('*').order('criado_em', { ascending: false });

  main.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">Escritórios</div><div class="page-sub">Gerencie todos os escritórios cadastrados</div></div>
    </div>
    <div class="form-card">
      <div class="form-title">Cadastrar novo escritório</div>
      <div class="form-grid">
        <div class="form-field"><label>Nome *</label><input id="f-nome" placeholder="HP Contabilidade" /></div>
        <div class="form-field"><label>CNPJ</label><input id="f-cnpj" placeholder="00.000.000/0001-00" /></div>
        <div class="form-field"><label>Slug (URL) *</label><input id="f-slug" placeholder="hp" /></div>
        <div class="form-field"><label>Plano</label>
          <select id="f-plano"><option value="basico">Básico</option><option value="pro">Pro</option><option value="enterprise">Enterprise</option></select>
        </div>
      </div>
      <div id="f-msg" class="hidden form-msg"></div>
      <button class="form-btn" onclick="criarEscritorio()">+ Criar escritório</button>
    </div>
    <div class="table-card" id="table-escritorios">
      <div class="table-head">
        <span class="table-title">Todos os escritórios (${(lista||[]).length})</span>
        <input class="search-input" placeholder="Buscar..." oninput="filtrarTabela(this.value)" />
      </div>
      <div id="rows-escritorios">
        ${(lista||[]).length === 0 ? '<div class="empty">Nenhum escritório cadastrado.</div>' : (lista||[]).map(e => rowEscritorio(e)).join('')}
      </div>
    </div>`;
}

function rowEscritorio(e) {
  const iniciais = (e.nome||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const planoClass = e.plano === 'pro' ? 'pill-pro' : e.plano === 'enterprise' ? 'pill-enterprise' : 'pill-basico';
  return `
    <div class="table-row" id="row-${e.id}">
      <div class="row-av">${iniciais}</div>
      <div style="flex:1">
        <div class="row-name">${e.nome}</div>
        <div class="row-info">${e.cnpj || 'CNPJ não informado'} · <span style="color:rgba(78,159,255,0.6)">?escritorio=${e.slug}</span></div>
      </div>
      <span class="pill ${e.ativo ? 'pill-active' : 'pill-inactive'}">${e.ativo ? 'Ativo' : 'Inativo'}</span>
      <span class="pill ${planoClass}" style="margin-left:4px;">${e.plano}</span>
      <div class="row-actions">
        <button class="action-btn" onclick="window.open('/?escritorio=${e.slug}','_blank')">Abrir</button>
        <button class="action-btn purple" onclick="abrirModal('${e.id}','${e.nome}','${e.slug}')">+ Admin</button>
        <button class="action-btn" onclick="toggleEscritorio('${e.id}',${e.ativo})" style="color:${e.ativo?'var(--red)':'var(--green)'};border-color:${e.ativo?'rgba(244,63,94,0.2)':'rgba(52,211,153,0.2)'};background:${e.ativo?'rgba(244,63,94,0.08)':'rgba(52,211,153,0.08)'};">${e.ativo?'Desativar':'Ativar'}</button>
        <button class="action-btn red" onclick="excluirEscritorio('${e.id}','${e.nome}')">🗑</button>
      </div>
    </div>`;
}

function filtrarTabela(q) {
  const rows = document.querySelectorAll('#rows-escritorios .table-row');
  rows.forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

async function criarEscritorio() {
  const nome = document.getElementById('f-nome').value.trim();
  const cnpj = document.getElementById('f-cnpj').value.trim();
  const slug = document.getElementById('f-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
  const plano = document.getElementById('f-plano').value;
  const msg = document.getElementById('f-msg');
  msg.classList.add('hidden');

  if (!nome || !slug) {
    msg.style.cssText='color:#f87171;background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.2);';
    msg.textContent='Nome e slug são obrigatórios.'; msg.classList.remove('hidden'); return;
  }

  const { error } = await sb.from('escritorios').insert({ nome, cnpj: cnpj||null, slug, plano, ativo: true, configurado: false });
  if (error) {
    msg.style.cssText='color:#f87171;background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.2);';
    msg.textContent='Erro: ' + (error.message.includes('unique') ? 'Slug já existe.' : error.message);
    msg.classList.remove('hidden'); return;
  }

  msg.style.cssText='color:#34d399;background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);';
  msg.textContent='✓ Escritório criado! URL: ?escritorio=' + slug;
  msg.classList.remove('hidden');
  document.getElementById('f-nome').value='';
  document.getElementById('f-cnpj').value='';
  document.getElementById('f-slug').value='';
  setTimeout(() => renderEscritorios(document.getElementById('main-content')), 1200);
}

async function toggleEscritorio(id, ativo) {
  await sb.from('escritorios').update({ ativo: !ativo }).eq('id', id);
  showPage(currentPage);
}

async function excluirEscritorio(id, nome) {
  if (!confirm('Excluir "' + nome + '"? Isso vai remover o escritório e todos os admins vinculados.')) return;
  await sb.from('escritorio_admins').delete().eq('escritorio_id', id);
  await sb.from('escritorios').delete().eq('id', id);
  showPage(currentPage);
}

// ALERTAS
async function renderAlertas(main) {
  const { data: escritorios } = await sb.from('escritorios').select('*').order('criado_em', { ascending: false });
  const { data: admins } = await sb.from('escritorio_admins').select('escritorio_id');

  const semAdmin = (escritorios||[]).filter(e => !(admins||[]).find(a => a.escritorio_id === e.id));
  const inativos = (escritorios||[]).filter(e => !e.ativo);

  const totalAlertas = semAdmin.length + inativos.length;
  const badge = document.getElementById('sb-alert-count');
  if (badge) { badge.textContent = totalAlertas; badge.style.display = totalAlertas > 0 ? 'inline' : 'none'; }

  main.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">Alertas</div><div class="page-sub">${totalAlertas} item(s) precisam de atenção</div></div>
    </div>
    ${semAdmin.length > 0 ? `
    <div class="table-card" style="margin-bottom:16px;">
      <div class="table-head"><span class="table-title" style="color:var(--red);">⚠ Sem admin cadastrado (${semAdmin.length})</span></div>
      ${semAdmin.map(e => `
        <div class="table-row">
          <div class="row-av">${(e.nome||'?')[0].toUpperCase()}</div>
          <div style="flex:1"><div class="row-name">${e.nome}</div><div class="row-info">Nenhum admin vinculado · slug: ${e.slug}</div></div>
          <button class="action-btn purple" onclick="abrirModal('${e.id}','${e.nome}','${e.slug}')">+ Adicionar admin</button>
        </div>`).join('')}
    </div>` : ''}
    ${inativos.length > 0 ? `
    <div class="table-card">
      <div class="table-head"><span class="table-title" style="color:var(--muted);">Escritórios inativos (${inativos.length})</span></div>
      ${inativos.map(e => `
        <div class="table-row">
          <div class="row-av" style="opacity:0.5;">${(e.nome||'?')[0].toUpperCase()}</div>
          <div style="flex:1"><div class="row-name">${e.nome}</div><div class="row-info">Inativo · slug: ${e.slug}</div></div>
          <button class="action-btn" style="color:var(--green);border-color:rgba(52,211,153,0.2);background:rgba(52,211,153,0.08);" onclick="toggleEscritorio('${e.id}',false)">Ativar</button>
        </div>`).join('')}
    </div>` : ''}
    ${totalAlertas === 0 ? '<div class="table-card"><div class="empty" style="padding:2rem;">Nenhum alerta no momento.</div></div>' : ''}`;
}

// MODAL ADMINS
async function abrirModal(id, nome, slug) {
  modalEscritorioId = id;
  modalEscritorioSlug = slug;
  document.getElementById('modal-title').textContent = 'Equipe — ' + nome;
  document.getElementById('modal-sub').textContent = '?escritorio=' + slug;
  document.getElementById('modal-admins').classList.remove('hidden');
  document.getElementById('ma-nome').value='';
  document.getElementById('ma-email').value='';
  document.getElementById('ma-msg').classList.add('hidden');
  await carregarModalLista();
}

function fecharModal() {
  document.getElementById('modal-admins').classList.add('hidden');
}

async function carregarModalLista() {
  const lista = document.getElementById('modal-lista');
  lista.innerHTML = '<div class="loading">Carregando...</div>';
  const { data: admins } = await sb.from('escritorio_admins').select('*').eq('escritorio_id', modalEscritorioId).order('nome');
  if (!admins || !admins.length) { lista.innerHTML = '<div class="empty">Nenhum membro ainda.</div>'; return; }
  lista.innerHTML = admins.map(a => `
    <div class="modal-row">
      <div class="modal-av ${a.role === 'colaborador' ? 'colab' : 'admin'}">${(a.nome||a.email).charAt(0).toUpperCase()}</div>
      <div style="flex:1;">
        <div style="color:#dde4f0;font-size:13px;font-weight:500;">${a.nome || '—'}</div>
        <div style="color:rgba(221,228,240,0.3);font-size:12px;">${a.email} · ${a.role}</div>
      </div>
      <button onclick="removerAdmin('${a.id}')" style="background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.2);color:#f87171;padding:4px 10px;border-radius:7px;font-size:12px;cursor:pointer;">Remover</button>
    </div>`).join('');
}

async function adicionarAdmin() {
  const nome = document.getElementById('ma-nome').value.trim();
  const email = document.getElementById('ma-email').value.trim();
  const msg = document.getElementById('ma-msg');
  msg.classList.add('hidden');

  if (!email || !email.includes('@')) {
    msg.style.cssText='color:#f87171;background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.2);';
    msg.textContent='E-mail inválido.'; msg.classList.remove('hidden'); return;
  }

  const senhaTemp = Math.random().toString(36).slice(-8).toUpperCase();
  await fetch('/api/set-user-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password:senhaTemp}) });

  const { error } = await sb.from('escritorio_admins').upsert({
    escritorio_id: modalEscritorioId, email, nome: nome||email.split('@')[0],
    role: 'admin', senha_tmp: senhaTemp, senha_definida: false
  }, { onConflict: 'escritorio_id,email' });

  if (error) {
    msg.style.cssText='color:#f87171;background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.2);';
    msg.textContent='Erro: '+error.message; msg.classList.remove('hidden'); return;
  }

  const link = window.location.origin + '/set-password.html?email=' + encodeURIComponent(email) + '&tmp=' + encodeURIComponent(senhaTemp) + '&escritorio=' + encodeURIComponent(modalEscritorioSlug);
  await fetch('/api/send-email', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
    destinatario: email, nomeCliente: nome||email,
    assunto: 'Acesso ao sistema Orbita',
    mensagemCustom: `<h2 style="color:#4e9fff;">orbita</h2><p>Olá, <strong>${nome||email}</strong>!</p><p>Você foi adicionado como administrador. Crie sua senha:</p><div style="margin:20px 0;"><a href="${link}" style="display:inline-block;background:#4e9fff;color:#fff;padding:14px 28px;border-radius:8px;text-decoration:none;font-weight:600;">Criar minha senha</a></div><p style="color:#888;font-size:12px;">${link}</p>`
  })});

  msg.style.cssText='color:#34d399;background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);';
  msg.textContent='✓ Admin adicionado! Convite enviado.'; msg.classList.remove('hidden');
  document.getElementById('ma-nome').value=''; document.getElementById('ma-email').value='';
  await carregarModalLista();
}

async function removerAdmin(id) {
  if (!confirm('Remover este membro?')) return;
  await sb.from('escritorio_admins').delete().eq('id', id);
  await carregarModalLista();
}

// Carregar contador de alertas no load
(async () => {
  const { data: escritorios } = await sb.from('escritorios').select('id,ativo');
  const { data: admins } = await sb.from('escritorio_admins').select('escritorio_id');
  const semAdmin = (escritorios||[]).filter(e => !(admins||[]).find(a => a.escritorio_id === e.id));
  const inativos = (escritorios||[]).filter(e => !e.ativo);
  const total = semAdmin.length + inativos.length;
  const badge = document.getElementById('sb-alert-count');
  if (badge && total > 0) { badge.textContent = total; badge.style.display = 'inline'; }
})();
</script>
