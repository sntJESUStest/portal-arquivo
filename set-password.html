<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>orbita — Criar senha</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0a0e1a; color: #dde4f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; overflow: hidden; }
    body::before { content: ''; position: fixed; top: -200px; right: -100px; width: 500px; height: 500px; background: #1a3a7a; border-radius: 50%; filter: blur(120px); opacity: 0.2; pointer-events: none; }
    body::after { content: ''; position: fixed; bottom: -100px; left: -50px; width: 350px; height: 350px; background: #7c5cfc; border-radius: 50%; filter: blur(100px); opacity: 0.15; pointer-events: none; }
    .wrap { width: 100%; max-width: 380px; position: relative; z-index: 1; }
    .logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 2.5rem; }
    .orb { position: relative; width: 36px; height: 36px; }
    .orb-ring { position: absolute; top: 50%; left: 50%; width: 33px; height: 15px; border: 1.5px solid #4e9fff; border-radius: 50%; transform: translate(-50%,-50%) rotate(-25deg); opacity: 0.85; }
    .orb-sphere { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; background: radial-gradient(circle at 35% 35%,#6ab4ff,#1a3a7a); border-radius: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 12px rgba(78,159,255,0.4); }
    .orb-dot { position: absolute; top: 3px; right: 2px; width: 5px; height: 5px; background: #7c5cfc; border-radius: 50%; }
    .logo-name { color: #dde4f0; font-weight: 300; letter-spacing: 3px; font-size: 22px; }
    .card { background: rgba(15,20,36,0.8); border: 1px solid rgba(78,159,255,0.15); border-radius: 16px; padding: 2rem; backdrop-filter: blur(20px); }
    .card-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .card-sub { font-size: 13px; color: rgba(221,228,240,0.45); margin-bottom: 1.5rem; line-height: 1.6; }
    label { display: block; font-size: 12px; color: rgba(221,228,240,0.4); margin-bottom: 6px; font-weight: 500; }
    input { width: 100%; padding: 11px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(78,159,255,0.15); border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 14px; color: #dde4f0; outline: none; transition: border-color 0.15s; margin-bottom: 1rem; }
    input:focus { border-color: rgba(78,159,255,0.4); background: rgba(78,159,255,0.04); }
    input::placeholder { color: rgba(221,228,240,0.2); }
    .btn { width: 100%; padding: 13px; background: linear-gradient(135deg,#4e9fff,#7c5cfc); border: none; border-radius: 10px; color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .msg { font-size: 13px; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
    .msg-error { background: rgba(248,113,113,0.08); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
    .msg-success { background: rgba(52,211,153,0.08); color: #34d399; border: 1px solid rgba(52,211,153,0.2); }
    .hidden { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="orb">
      <div class="orb-ring"></div>
      <div class="orb-sphere"></div>
      <div class="orb-dot"></div>
    </div>
    <span class="logo-name">orbita</span>
  </div>

  <div class="card" id="card-form">
    <div class="card-title">Criar sua senha</div>
    <div class="card-sub">Defina uma senha segura para acessar o sistema.</div>
    <div id="msg-error" class="msg msg-error hidden"></div>
    <label>Nova senha</label>
    <input id="pw-new" type="password" placeholder="Mínimo 8 caracteres" />
    <label>Confirmar senha</label>
    <input id="pw-confirm" type="password" placeholder="Repita a senha" onkeydown="if(event.key==='Enter')definirSenha()" />
    <button class="btn" onclick="definirSenha()" id="btn-salvar">Criar senha e acessar</button>
  </div>

  <div class="card hidden" id="card-ok">
    <div style="text-align:center;">
      <div style="font-size:40px;margin-bottom:1rem;">✅</div>
      <div class="card-title" style="text-align:center;margin-bottom:8px;">Senha criada!</div>
      <div class="card-sub" style="text-align:center;">Redirecionando para o sistema...</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://nacdezqdsouhxgftqaku.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hY2RlenFkc291aHhnZnRxYWt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODU4MjYsImV4cCI6MjA5NDg2MTgyNn0.C1eqGfu7h-oOC0ibw6hzecPsG49e6IrOXrxu0C-mOSY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const emailParam = params.get('email');
const tmpParam = params.get('tmp');
const escritorioParam = params.get('escritorio');

async function definirSenha() {
  const nova = document.getElementById('pw-new').value;
  const confirma = document.getElementById('pw-confirm').value;
  const errEl = document.getElementById('msg-error');
  const btn = document.getElementById('btn-salvar');
  errEl.classList.add('hidden');

  if (!nova || nova.length < 8) { errEl.textContent = 'A senha deve ter pelo menos 8 caracteres.'; errEl.classList.remove('hidden'); return; }
  if (nova !== confirma) { errEl.textContent = 'As senhas não coincidem.'; errEl.classList.remove('hidden'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Salvando...';

  try {
    // 1. Usar API admin para atualizar a senha (funciona mesmo que o usuário já exista)
    const apiResp = await fetch('/api/set-user-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: emailParam, password: nova })
    });
    const apiData = await apiResp.json();

    if (!apiData.ok) {
      // Fallback: tentar login com senha tmp e depois atualizar
      const { error: loginErr } = await sb.auth.signInWithPassword({ email: emailParam, password: tmpParam });
      if (loginErr) throw new Error('Acesso inválido. Solicite um novo convite.');
      const { error: updateErr } = await sb.auth.updateUser({ password: nova });
      if (updateErr) throw new Error(updateErr.message);
    } else {
      // Login com a nova senha — tentar até 3 vezes (Supabase pode demorar para confirmar)
      let loginErr = null;
      for (let i = 0; i < 3; i++) {
        const { error } = await sb.auth.signInWithPassword({ email: emailParam, password: nova });
        if (!error) { loginErr = null; break; }
        loginErr = error;
        await new Promise(r => setTimeout(r, 1000));
      }
      if (loginErr) throw new Error('Erro ao fazer login: ' + loginErr.message);
    }

    // 2. Marcar senha como definida na tabela correta
    await sb.from('clientes').update({ senha_definida: true, senha_tmp: null }).eq('email', emailParam);
    await sb.from('escritorio_admins').update({ senha_definida: true, senha_tmp: null }).eq('email', emailParam);

    // 3. Mostrar sucesso e redirecionar
    document.getElementById('card-form').classList.add('hidden');
    document.getElementById('card-ok').classList.remove('hidden');

    setTimeout(() => {
      const dest = escritorioParam ? '/?escritorio=' + encodeURIComponent(escritorioParam) : '/empresas';
      window.location.href = dest;
    }, 2000);

  } catch(e) {
    errEl.textContent = e.message || 'Erro ao salvar senha.';
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Criar senha e acessar';
  }
}
</script>
</body>
</html>
